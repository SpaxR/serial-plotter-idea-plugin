name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

# Required repository secrets:
#   CERTIFICATE_CHAIN    - X509 certificate chain (PEM) used to sign the plugin
#   PRIVATE_KEY          - Private key (PEM, may be encrypted) matching the certificate
#   PRIVATE_KEY_PASSWORD - Passphrase for PRIVATE_KEY
# GITHUB_TOKEN is provided automatically by Actions and needs no setup.
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Sign plugin
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew signPlugin

      - name: Locate signed plugin
        id: artifact
        run: |
          file=$(find build/distributions -name "*-signed.zip" | head -n1)
          if [ -z "$file" ]; then
            echo "No signed plugin zip found in build/distributions" >&2
            exit 1
          fi
          echo "path=$file" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" "${{ steps.artifact.outputs.path }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes

      - name: Upload signed plugin as workflow artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: signed-plugin
          path: ${{ steps.artifact.outputs.path }}
